[package]
name = "QW"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  "crates/*"
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.dev]
opt-level = 0
debug = 1

[dependencies]
qwc_route = { path = "crates/qwc_route" }
qwc_diagnostic = { path = "crates/qwc_diagnostic" }
rustc_apfloat = "0.2.3"
